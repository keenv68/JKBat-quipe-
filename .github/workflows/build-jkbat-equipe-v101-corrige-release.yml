name: Build JKBat Equipe v1.0.1 Corrige Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          test -f "JKBat_Equipe-v1.0.1-Notifications-Compte-Rendu-CORRIGE-source.zip" || {
            echo "ERREUR: JKBat_Equipe-v1.0.1-Notifications-Compte-Rendu-CORRIGE-source.zip introuvable à la racine du dépôt."
            exit 1
          }

      - name: Extract JKBat Equipe v1.0.1 corrige
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "JKBat_Equipe-v1.0.1-Notifications-Compte-Rendu-CORRIGE-source.zip" -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing secrets
        env:
          JKBAT_KEYSTORE_BASE64: ${{ secrets.JKBAT_KEYSTORE_BASE64 }}
          JKBAT_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$JKBAT_KEYSTORE_BASE64" || { echo "ERREUR: secret JKBAT_KEYSTORE_BASE64 manquant."; exit 1; }
          test -n "$JKBAT_KEYSTORE_PASSWORD" || { echo "ERREUR: secret JKBAT_KEYSTORE_PASSWORD manquant."; exit 1; }

      - name: Restore JKBat release keystore
        working-directory: extracted/JKBat_Equipe-v1.0.1-Notifications-Compte-Rendu-CORRIGE-source
        env:
          JKBAT_KEYSTORE_BASE64: ${{ secrets.JKBAT_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$JKBAT_KEYSTORE_BASE64" | base64 --decode > jkbat-services-release.jks
          test -s jkbat-services-release.jks

      - name: Build signed RELEASE APK
        working-directory: extracted/JKBat_Equipe-v1.0.1-Notifications-Compte-Rendu-CORRIGE-source
        env:
          JKBAT_KEYSTORE_FILE: jkbat-services-release.jks
          JKBAT_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Prepare final APK
        run: |
          APK="extracted/JKBat_Equipe-v1.0.1-Notifications-Compte-Rendu-CORRIGE-source/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "JKBat_Equipe-v1.0.1-CORRIGE-RELEASE.apk"
          sha256sum "JKBat_Equipe-v1.0.1-CORRIGE-RELEASE.apk" > "JKBat_Equipe-v1.0.1-CORRIGE-RELEASE.sha256"

      - name: Upload JKBat Equipe v1.0.1 Corrige Release
        uses: actions/upload-artifact@v4
        with:
          name: JKBat_Equipe-v1.0.1-CORRIGE-RELEASE
          path: |
            JKBat_Equipe-v1.0.1-CORRIGE-RELEASE.apk
            JKBat_Equipe-v1.0.1-CORRIGE-RELEASE.sha256
          if-no-files-found: error
          retention-days: 30
