name: Build JKBat Equipe v1.0.5 Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract v1.0.5 project
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'JKBat_Equipe-v1.0.5-*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Aucun ZIP JKBat_Equipe-v1.0.5-*.zip trouvé à la racine."
            ls -la
            exit 1
          fi
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -maxdepth 1 -type d -name 'JKBat_Equipe-v1.0.5-*' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Dossier projet v1.0.5 introuvable après extraction."
            find extracted -maxdepth 2 -type d -print
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing secrets
        env:
          JKBAT_KEYSTORE_BASE64: ${{ secrets.JKBAT_KEYSTORE_BASE64 }}
          JKBAT_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_KEYSTORE_PASSWORD }}
        run: |
          test -n "$JKBAT_KEYSTORE_BASE64" || { echo "ERREUR: secret JKBAT_KEYSTORE_BASE64 manquant."; exit 1; }
          test -n "$JKBAT_KEYSTORE_PASSWORD" || { echo "ERREUR: secret JKBAT_KEYSTORE_PASSWORD manquant."; exit 1; }

      - name: Restore release keystore
        env:
          JKBAT_KEYSTORE_BASE64: ${{ secrets.JKBAT_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$JKBAT_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/jkbat-services-release.jks"
          test -s "$PROJECT_DIR/jkbat-services-release.jks"

      - name: Build signed RELEASE APK
        env:
          JKBAT_KEYSTORE_FILE: jkbat-services-release.jks
          JKBAT_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_KEYSTORE_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare final APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" JKBat_Equipe-v1.0.5-RELEASE.apk
          sha256sum JKBat_Equipe-v1.0.5-RELEASE.apk > JKBat_Equipe-v1.0.5-RELEASE.sha256

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: JKBat_Equipe-v1.0.5-RELEASE
          path: |
            JKBat_Equipe-v1.0.5-RELEASE.apk
            JKBat_Equipe-v1.0.5-RELEASE.sha256
          if-no-files-found: error
          retention-days: 30
