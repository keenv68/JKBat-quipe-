name: Build JKBat Equipe v1.0.53 - Verrou Confirmation Total

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract JKBat Equipe v1.0.53 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'JKBat_Equipe-v1.0.53-Verrou-Confirmation-Total-source.zip' -size +1k -print -quit 2>/dev/null)"
          test -n "${ZIP_FILE:-}" || { echo 'ERREUR : ZIP v1.0.53 introuvable'; exit 1; }
          rm -rf extracted && mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"
          test -n "${SETTINGS:-}" || { echo 'ERREUR : projet Android introuvable'; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Verify JKBat Equipe v1.0.53
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q 'versionCode = 153' "$GRADLE"
          grep -q 'versionName = "1.0.53"' "$GRADLE"
          grep -q 'JKBAT ÉQUIPE · 1.0.53' "$HTML"
          grep -q 'jke-152-client-confirmation-lock' "$HTML"
          grep -q 'SERVER_AND_UI_V2_IMPOSSIBLE' "$HTML"
          grep -q 'impossibleOpenBase153' "$HTML"
          grep -q 'Créneau non confirmé par le client' "$HTML"
          grep -q 'Créneau confirmé par le client' "$HTML"
          grep -q 'jke-149-planning-auto-sync' "$HTML"
          grep -q 'jke-150-legacy-workflow-restore-script' "$HTML"
          echo 'OK : JKBat Équipe v1.0.53 validée'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        shell: bash
        env:
          JKBAT_KEYSTORE_BASE64: ${{ secrets.JKBAT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${JKBAT_KEYSTORE_BASE64:-}" || { echo 'ERREUR : secret JKBAT_KEYSTORE_BASE64 manquant'; exit 1; }
          printf '%s' "$JKBAT_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/jkbat-services-release.jks"
          test -s "$PROJECT_DIR/jkbat-services-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          JKBAT_KEYSTORE_FILE: jkbat-services-release.jks
          JKBAT_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_KEYSTORE_PASSWORD }}
          JKBAT_KEY_ALIAS: jkbat-services
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | grep '/release/' | head -1)"
          test -n "${APK:-}" || { echo 'ERREUR : APK release introuvable'; exit 1; }
          cp "$APK" JKBat_Equipe-v1.0.53-Verrou-Confirmation-Total.apk
          jarsigner -verify JKBat_Equipe-v1.0.53-Verrou-Confirmation-Total.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JKBat-Equipe-v1.0.53-Verrou-Confirmation-Total
          path: JKBat_Equipe-v1.0.53-Verrou-Confirmation-Total.apk
          if-no-files-found: error
