name: Build JKBat Pro v6.16.77 Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="JKBat_Pro-v6.16.77-Tableau-Financier-Relances-source.zip"
          test -f "$ZIP_FILE" || { echo "ERREUR: $ZIP_FILE introuvable à la racine du dépôt."; ls -la; exit 1; }
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="extracted/JKBat_Pro-v6.16.77-Tableau-Financier-Relances-source"
          test -d "$PROJECT_DIR" || { echo "ERREUR: dossier projet introuvable après extraction."; find extracted -maxdepth 2 -type d -print; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing secrets
        shell: bash
        env:
          JKBAT_PRO_KEYSTORE_BASE64: ${{ secrets.JKBAT_PRO_KEYSTORE_BASE64 }}
          JKBAT_PRO_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_PRO_KEYSTORE_PASSWORD }}
        run: |
          set -e
          test -n "$JKBAT_PRO_KEYSTORE_BASE64" || { echo "ERREUR: secret JKBAT_PRO_KEYSTORE_BASE64 manquant."; exit 1; }
          test -n "$JKBAT_PRO_KEYSTORE_PASSWORD" || { echo "ERREUR: secret JKBAT_PRO_KEYSTORE_PASSWORD manquant."; exit 1; }

      - name: Restore JKBat Pro release keystore
        shell: bash
        env:
          JKBAT_PRO_KEYSTORE_BASE64: ${{ secrets.JKBAT_PRO_KEYSTORE_BASE64 }}
        run: |
          set -e
          printf '%s' "$JKBAT_PRO_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/jkbat-pro-release.jks"
          test -s "$PROJECT_DIR/jkbat-pro-release.jks"

      - name: Build signed RELEASE APK
        shell: bash
        env:
          JKBAT_STOREPASS: ${{ secrets.JKBAT_PRO_KEYSTORE_PASSWORD }}
          JKBAT_KEYPASS: ${{ secrets.JKBAT_PRO_KEYSTORE_PASSWORD }}
          JKBAT_ALIAS: jkbat-pro
        run: |
          set -e
          cd "$PROJECT_DIR"
          export JKBAT_KEYSTORE="$GITHUB_WORKSPACE/$PROJECT_DIR/jkbat-pro-release.jks"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare release APK
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" JKBat-Pro-v6.16.77-RELEASE.apk
          jarsigner -verify JKBat-Pro-v6.16.77-RELEASE.apk
          sha256sum JKBat-Pro-v6.16.77-RELEASE.apk > JKBat-Pro-v6.16.77-RELEASE.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: JKBat-Pro-v6.16.77-RELEASE
          path: |
            JKBat-Pro-v6.16.77-RELEASE.apk
            JKBat-Pro-v6.16.77-RELEASE.sha256
          if-no-files-found: error
          retention-days: 30
