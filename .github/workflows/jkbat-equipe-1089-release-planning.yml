name: JKBat Equipe 1.0.89 - RELEASE correctif planning uniquement
on:
  workflow_dispatch:
  push:
    branches: [validation-sql-sans-perte-20261028]
    paths: ['.github/workflows/jkbat-equipe-1089-release-planning.yml']
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparation depuis la derniere source Equipe stable
        shell: bash
        run: |
          set -euo pipefail
          unzip -q JKBat_Equipe-v1.0.88-UI-Accueil-Client-Style-source.zip -d source
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('source')
          hfile=root/'app/src/main/assets/index.html'
          gfile=root/'app/build.gradle.kts'
          h=hfile.read_text(encoding='utf-8')
          old='.filter(a=>!a?.archived_at||!isDone(a))'
          new='.filter(a=>!a?.archived_at)'
          assert h.count(old)==2,'Source historique inattendue : ne pas compiler'
          h=h.replace(old,new)
          hfile.write_text(h,encoding='utf-8')
          g=gfile.read_text(encoding='utf-8')
          assert 'applicationId = "com.jkbat.equipe"' in g,'ID application officielle différent'
          assert 'versionName = "1.0.88"' in g,'Version source inattendue'
          g,n=re.subn(r'versionCode\s*=\s*\d+','versionCode = 1089',g,count=1)
          assert n==1
          g=g.replace('versionName = "1.0.88"','versionName = "1.0.89"')
          gfile.write_text(g,encoding='utf-8')
          assert old not in h
          assert h.count(new)>=2
          print('OK : source v1.0.88 conservée ; uniquement deux filtres archived_at corrigés.')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signer avec le certificat officiel Équipe existant
        shell: bash
        env:
          SIGN_KEY: ${{ secrets.JKBAT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGN_KEY" || { echo 'Keystore officiel absent'; exit 1; }
          printf '%s' "$SIGN_KEY" | base64 --decode > source/jkbat-services-release.jks
          test -s source/jkbat-services-release.jks
      - name: Compiler APK release signée
        working-directory: source
        env:
          JKBAT_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_KEYSTORE_PASSWORD }}
          JKBAT_KEY_ALIAS: jkbat-services
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JKBAT_KEYSTORE_PASSWORD"
          gradle assembleRelease -x lintVitalAnalyzeRelease -x lintVitalRelease -x lintVitalReportRelease --no-daemon
      - name: Contrôler intégrité de APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find source/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep "package: name='com.jkbat.equipe'"
          "$AAPT" dump badging "$APK" | grep "versionCode='1089'"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --verbose "$APK"
          mkdir -p livraison
          cp "$APK" livraison/JKBat_Equipe_1.0.89_RELEASE_SIGNEE.apk
          sha256sum livraison/*.apk > livraison/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JKBat-Equipe-1.0.89-RELEASE-SIGNEE
          path: livraison/
          if-no-files-found: error
          retention-days: 7
