name: JKBat Equipe V7 - retrait actif TEST isole
on:
  workflow_dispatch:
  push:
    branches: [validation-sql-sans-perte-20261028]
    paths:
      - '.github/workflows/jkbat-v7-retrait-actif-test.yml'
jobs:
  retrait-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparer une application de TEST separee des versions officielles
        run: |
          set -euo pipefail
          mkdir source-v7-retrait
          unzip -q JKBat_Equipe-v1.0.88-UI-Accueil-Client-Style-source.zip -d source-v7-retrait
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('source-v7-retrait')
          gradle=root/'app/build.gradle.kts'
          html=root/'app/src/main/assets/index.html'
          script=Path('tests/v7-integration/v7-team-withdraw.js')
          assert gradle.is_file() and html.is_file() and script.is_file()
          g=gradle.read_text(encoding='utf-8')
          g,n=re.subn(r'(?m)^(\s*applicationId\s*=\s*)"[^"]+"',r'\g<1>"com.jkbat.equipe.v7retrait20261028"',g,count=1)
          assert n==1, 'Package isolation manquante'
          gradle.write_text(g,encoding='utf-8')
          h=html.read_text(encoding='utf-8')
          bad='.filter(a=>!a?.archived_at||!isDone(a))'
          assert h.count(bad)==2, 'Synchronisation historique inattendue'
          h=h.replace(bad,'.filter(a=>!a?.archived_at)')
          assert h.count('.filter(a=>!a?.archived_at)')>=2
          assert '</body>' in h
          h=h.replace('</body>','<script src="v7-team-withdraw.js"></script>\n</body>',1)
          html.write_text(h,encoding='utf-8')
          s=script.read_text(encoding='utf-8')
          assert "const ENABLED=false;" in s
          assert "&& !a.completed_at;" in s
          s=s.replace("const ENABLED=false;", "const ENABLED=true; // ONLY the isolated TEST APK", 1)
          s=s.replace("&& !a.completed_at;", "&& !a.started_at && !a.completed_at;", 1)
          assert "const ENABLED=true" in s and "!a.started_at" in s
          (root/'app/src/main/assets/v7-team-withdraw.js').write_text(s, encoding='utf-8')
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text(encoding='utf-8')
          assert 'android:label="JKBat Équipe"' in m
          m=m.replace('android:label="JKBat Équipe"','android:label="JKBat V7 Retrait TEST"',1)
          manifest.write_text(m,encoding='utf-8')
          print('V7: test application isolated, RPC withdrawal ENABLED, official unchanged')
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Valider le script actif et la protection started_at
        run: |
          set -euo pipefail
          node --check source-v7-retrait/app/src/main/assets/v7-team-withdraw.js
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const script=fs.readFileSync('source-v7-retrait/app/src/main/assets/v7-team-withdraw.js','utf8');
          const own='11111111-1111-4111-8111-111111111111';
          const m={id:'22222222-2222-4222-8222-222222222222',staff_user_id:own,source_type:'TACHE',status:'À FAIRE',archived_at:null,started_at:null,completed_at:null};
          const sandbox={window:{confirm:()=>true},user:{id:own},profile:{active:true},assignments:[m],console,api:async()=>({ok:true,result:'withdrawn'}),renderAll:()=>{},refreshAll:async()=>{},toast:()=>{}};
          vm.createContext(sandbox);vm.runInContext(script,sandbox);
          const v=sandbox.window.JKBatV7TeamWithdraw;
          assert(v.enabled());assert(v.canWithdraw(m),'Mission a faire');
          assert(!v.canWithdraw({...m,started_at:new Date().toISOString()}),'Mission commencee non retirable');
          assert(!v.canWithdraw({...m,completed_at:new Date().toISOString()}),'Mission finie non retirable');
          assert(!v.canWithdraw({...m,staff_user_id:'autre'}),'Affectation autre technicien');
          v.withdraw(m.id).then(ok=>{
            assert(ok===true);
            assert(sandbox.assignments.length===0);
            console.log('PASS JS V7: RPC simulée, retrait local, droits et started_at');
          }).catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Compiler APK test avec retrait RPC actif
        working-directory: source-v7-retrait
        run: gradle :app:assembleDebug --no-daemon
      - name: Verifier et copier APK distincte
        run: |
          set -euo pipefail
          APK=source-v7-retrait/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -m1 "^package: name='com.jkbat.equipe.v7retrait20261028'"
          cp "$APK" JKBat_Equipe_V7_RETRAIT_ACTIF_TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JKBat-Equipe-V7-Retrait-ACTIF-TEST-APK
          path: JKBat_Equipe_V7_RETRAIT_ACTIF_TEST.apk
          retention-days: 2
          if-no-files-found: error
