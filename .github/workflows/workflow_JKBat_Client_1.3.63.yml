name: Build JKBat Client v1.3.63 - Confirme Visuel Persistant

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'JKBat_Client-v1.3.63-Confirme-Visuel-Persistant-source.zip' -size +1k -print -quit)"
          test -n "${ZIP_FILE:-}" || { echo 'ZIP Client v1.3.63 introuvable'; exit 1; }
          rm -rf extracted && mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
          test -n "${SETTINGS:-}" || { echo 'Projet Android introuvable'; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Verify v1.3.63
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 1363' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1.3.63"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'CONFIRMED_MILESTONE_RENDER_FROM_PROGRESS_V1' "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q 'CONFIRMED_CORE_BINDING_AND_HISTORY_V1' "$PROJECT_DIR/app/src/main/assets/index.html"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore keystore
        shell: bash
        env:
          JKBAT_KEYSTORE_BASE64: ${{ secrets.JKBAT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$JKBAT_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/jkbat-services-release.jks"
          test -s "$PROJECT_DIR/jkbat-services-release.jks"

      - name: Build signed APK
        shell: bash
        env:
          JKBAT_KEYSTORE_FILE: jkbat-services-release.jks
          JKBAT_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_KEYSTORE_PASSWORD }}
          JKBAT_KEY_ALIAS: jkbat-services
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | grep '/release/' | head -1)"
          test -n "${APK:-}" || { echo 'APK release introuvable'; exit 1; }
          cp "$APK" JKBat_Client-v1.3.63-Confirme-Visuel-Persistant.apk
          jarsigner -verify JKBat_Client-v1.3.63-Confirme-Visuel-Persistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JKBat-Client-v1.3.63-Confirme-Visuel-Persistant
          path: JKBat_Client-v1.3.63-Confirme-Visuel-Persistant.apk
          if-no-files-found: error
