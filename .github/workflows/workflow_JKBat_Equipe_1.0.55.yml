name: Build JKBat Equipe v1.0.55 - Signatures Obligatoires

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'JKBat_Equipe-v1.0.55-Signatures-Obligatoires-source.zip' -size +1k -print -quit 2>/dev/null)"
          test -n "${ZIP_FILE:-}" || { echo 'ERREUR : ZIP Equipe v1.0.55 introuvable'; exit 1; }
          rm -rf extracted && mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
          test -n "${SETTINGS:-}" || { echo 'ERREUR : projet Android introuvable'; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Verify JKBat Equipe v1.0.55
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q 'versionCode = 155' "$GRADLE"
          grep -q 'versionName = "1.0.55"' "$GRADLE"
          grep -q 'CLIENT_AND_TECH_REQUIRED_BEFORE_SEND_V1' "$HTML"
          echo 'OK : JKBat Equipe v1.0.55 validé'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew :app:assembleRelease --no-daemon --stacktrace; else gradle :app:assembleRelease --no-daemon --stacktrace; fi

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | grep '/release/' | head -1)"
          test -n "${APK:-}" || { echo 'ERREUR : APK release introuvable'; exit 1; }
          cp "$APK" JKBat_Equipe-v1.0.55-Signatures-Obligatoires.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JKBat-Equipe-v1.0.55-Signatures-Obligatoires
          path: JKBat_Equipe-v1.0.55-Signatures-Obligatoires.apk
          if-no-files-found: error
