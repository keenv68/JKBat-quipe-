name: Build JKBat Equipe v1.0.56 - Confirmation Client Live

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'JKBat_Equipe-v1.0.56-Confirmation-Client-Live-source.zip' -size +1k -print -quit)"
          test -n "${ZIP_FILE:-}" || { echo "ERREUR : ZIP Equipe v1.0.56 introuvable"; exit 1; }

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
          test -n "${SETTINGS:-}" || { echo "ERREUR : projet Android introuvable"; exit 1; }

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 156' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1.0.56"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'REMOTE_APPOINTMENT_AUTHORITATIVE_V1' "$PROJECT_DIR/app/src/main/assets/index.html"
          echo "OK : JKBat Equipe v1.0.56"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        shell: bash
        env:
          JKBAT_KEYSTORE_BASE64: ${{ secrets.JKBAT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${JKBAT_KEYSTORE_BASE64:-}" || {
            echo "ERREUR : secret GitHub JKBAT_KEYSTORE_BASE64 manquant"
            exit 1
          }

          printf '%s' "$JKBAT_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/jkbat-services-release.jks"
          test -s "$PROJECT_DIR/jkbat-services-release.jks"
          echo "OK : keystore restaure"

      - name: Build release APK
        shell: bash
        env:
          JKBAT_KEYSTORE_FILE: jkbat-services-release.jks
          JKBAT_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_KEYSTORE_PASSWORD }}
          JKBAT_KEY_ALIAS: jkbat-services
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f jkbat-services-release.jks || {
            echo "ERREUR : jkbat-services-release.jks absent"
            exit 1
          }

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | grep '/release/' | head -1)"
          test -n "${APK:-}" || { echo "ERREUR : APK release introuvable"; exit 1; }

          cp "$APK" JKBat_Equipe-v1.0.56-Confirmation-Client-Live.apk
          jarsigner -verify JKBat_Equipe-v1.0.56-Confirmation-Client-Live.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JKBat-Equipe-v1.0.56-Confirmation-Client-Live
          path: JKBat_Equipe-v1.0.56-Confirmation-Client-Live.apk
          if-no-files-found: error
