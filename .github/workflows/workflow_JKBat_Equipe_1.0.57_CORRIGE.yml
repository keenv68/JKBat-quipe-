name: Build JKBat Equipe v1.0.57 - Signature Par Intervention
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'JKBat_Equipe-v1.0.57-Signature-Par-Intervention-source.zip' -size +1k -print -quit)"
          test -n "${ZIP_FILE:-}" || { echo 'ERREUR : ZIP Equipe v1.0.57 introuvable'; exit 1; }
          rm -rf extracted && mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"
          test -n "${SETTINGS:-}" || { echo 'Projet Android introuvable'; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q 'versionCode = 157' "$GRADLE"
          grep -q 'versionName = "1.0.57"' "$GRADLE"
          grep -q 'REMOTE_APPOINTMENT_AUTHORITATIVE_V1' "$HTML"
          grep -q 'PER_ASSIGNMENT_PER_REVISION_V1' "$HTML"
          grep -q 'jkbat_staff_save_assignment_technician_signature' "$HTML"
          echo 'OK : JKBat Equipe v1.0.57'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release keystore
        shell: bash
        env:
          JKBAT_KEYSTORE_BASE64: ${{ secrets.JKBAT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${JKBAT_KEYSTORE_BASE64:-}" || { echo 'ERREUR : secret JKBAT_KEYSTORE_BASE64 manquant'; exit 1; }
          printf '%s' "$JKBAT_KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/jkbat-services-release.jks"
          test -s "$PROJECT_DIR/jkbat-services-release.jks"
      - name: Build signed release APK
        env:
          JKBAT_KEYSTORE_FILE: jkbat-services-release.jks
          JKBAT_KEYSTORE_PASSWORD: ${{ secrets.JKBAT_KEYSTORE_PASSWORD }}
          JKBAT_KEY_ALIAS: jkbat-services
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew :app:assembleRelease --no-daemon --stacktrace; else gradle :app:assembleRelease --no-daemon --stacktrace; fi
      - name: Prepare APK
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | grep '/release/' | head -1)"
          test -n "${APK:-}" || { echo 'APK introuvable'; exit 1; }
          cp "$APK" JKBat_Equipe-v1.0.57-Signature-Par-Intervention.apk
          jarsigner -verify JKBat_Equipe-v1.0.57-Signature-Par-Intervention.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JKBat-Equipe-v1.0.57-Signature-Par-Intervention
          path: JKBat_Equipe-v1.0.57-Signature-Par-Intervention.apk
          if-no-files-found: error
